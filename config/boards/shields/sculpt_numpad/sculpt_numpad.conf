# Microsoft Sculpt Ergonomic Numpad - ZMK Config

# Enable Bluetooth
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Enable USB (for wired mode / charging)
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Sculpt Numpad"
CONFIG_ZMK_USB=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_POLICY_RESIDENCY=y
CONFIG_PM_POLICY_DEVICE=y

# Battery reporting (nice!nano has battery divider)
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep for power saving
CONFIG_ZMK_SLEEP=y

# HID
CONFIG_ZMK_HID_INDICATORS=y

# Logging (for debugging, can disable later)
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
