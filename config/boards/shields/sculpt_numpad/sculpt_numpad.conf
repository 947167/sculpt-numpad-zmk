# Microsoft Sculpt Ergonomic Numpad - ZMK Config

# Enable Bluetooth
CONFIG_ZMK_BLE=y

# Enable USB (for wired mode / charging)
CONFIG_ZMK_USB=y

# Power management
CONFIG_PM=y

# Battery reporting (nice!nano has battery divider)
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep for power saving
CONFIG_ZMK_SLEEP=y

# HID indicators
CONFIG_ZMK_HID_INDICATORS=y

# USB logging for matrix diagnosis
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
